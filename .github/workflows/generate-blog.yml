name: Generate Daily Blog Posts

on:
  schedule:
    # 3 articles/day batched into ONE run = ONE build (was 3 separate crons).
    # Consolidated 2026-05-29 to cut Vercel Build CPU Minutes (~3 builds/day -> 1).
    - cron: '0 1 * * *'   # 01:00 UTC = 08:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate blog posts (bootstrap buffer, then 3/day)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Keep the production buffer above the card's >15 acceptance gate without
          # changing the publishing cadence. When the forward buffer is low, bootstrap
          # enough future slots in this run; once healthy, return to 3 generated posts/day.
          FUTURE_COUNT=$(python3 - <<'PY'
          import json
          from datetime import date, datetime, timezone
          from pathlib import Path

          today = datetime.now(timezone.utc).date()
          count = 0
          for path in Path('content/blog').glob('*.json'):
              try:
                  post = json.loads(path.read_text())
                  published = date.fromisoformat(str(post.get('date', ''))[:10])
              except (ValueError, TypeError, json.JSONDecodeError):
                  continue
              if not post.get('retired') and published > today:
                  count += 1
          print(count)
          PY
          )
          if [ "$FUTURE_COUNT" -le 15 ]; then
            RUNS=7
            echo "bootstrap mode: future_count=$FUTURE_COUNT, generation_runs=$RUNS"
          else
            RUNS=3
            echo "steady mode: future_count=$FUTURE_COUNT, generation_runs=$RUNS"
          fi

          # Each run pulls the next keyword and uses the earliest under-quota date
          # between tomorrow and D+7. That keeps at most 3 articles per publish date.
          for i in $(seq 1 "$RUNS"); do
            PUBLISH_DATE=$(node scripts/next-publish-date.mjs --min-offset 1 --horizon 7)
            echo "run $i/$RUNS -> PUBLISH_DATE=$PUBLISH_DATE"
            PUBLISH_DATE=$PUBLISH_DATE npm run generate:blog || echo "::warning::generate run $i failed, continuing"
          done

      - name: Verify generation produced files (cycle #9 audit)
        run: |
          echo "=== Untracked .json in content/blog ==="
          git ls-files --others --exclude-standard content/blog/ | head -5
          echo "=== Git status (porcelain) ==="
          git status --porcelain | head -20

      - name: Pre-publish guard (dates, redirect/slug conflicts)
        # Fails the run BEFORE anything is pushed if a generated article's
        # date format is wrong or its slug collides with a redirect source
        # (a collision would 301 the new article into /blog on deploy).
        run: node scripts/check-scheduled-publishing.mjs

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/ public/images/blog/ data/keyword-queue.json data/keyword-consumed.json
          echo "=== Staged paths ==="
          git diff --staged --name-only
          if git diff --staged --quiet; then
            echo "No new blog post generated"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "blog: auto-generate articles $(date +%Y-%m-%d-%H%M)"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Submit newly published articles to IndexNow
        if: steps.commit.outputs.published == 'true'
        run: |
          git diff-tree --no-commit-id --name-only -r HEAD -- 'content/blog/*.json' > /tmp/published-blog-files.txt
          python3 - <<'PY' > /tmp/indexnow-urls.txt
          import json
          from pathlib import Path

          for raw in Path('/tmp/published-blog-files.txt').read_text().splitlines():
              path = Path(raw)
              if not path.is_file():
                  continue
              slug = json.loads(path.read_text()).get('slug')
              if slug:
                  print(f'https://www.sesoris.com/blog/{slug}')
          PY
          if [ -s /tmp/indexnow-urls.txt ]; then
            xargs python3 scripts/submit_indexnow.py < /tmp/indexnow-urls.txt
          else
            echo "No published article URLs found for IndexNow"
          fi
