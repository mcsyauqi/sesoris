name: Generate Daily Blog Posts

on:
  schedule:
    # 3 articles/day: 08:00, 13:00, 18:00 WIB
    - cron: '0 1 * * *'   # 01:00 UTC = 08:00 WIB
    - cron: '0 6 * * *'   # 06:00 UTC = 13:00 WIB
    - cron: '0 11 * * *'  # 11:00 UTC = 18:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate:blog

      - name: Verify generation produced files (cycle #9 audit)
        run: |
          echo "=== Untracked .json in content/blog ==="
          git ls-files --others --exclude-standard content/blog/ | head -5
          echo "=== Git status (porcelain) ==="
          git status --porcelain | head -20

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/ public/images/blog/ data/keyword-queue.json
          echo "=== Staged paths ==="
          git diff --staged --name-only
          if git diff --staged --quiet; then
            echo "No new blog post generated"
            exit 0
          fi
          git commit -m "blog: auto-generate article $(date +%Y-%m-%d-%H%M)"
          git push
