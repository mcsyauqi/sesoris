<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Cloffice layout, front view of a reach-in closet"><title>Cloffice layout, front view of a reach-in closet</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Cloffice layout, front view of a reach-in closet</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A2E"/></marker></defs><rect x="60" y="95" width="740" height="540" fill="#fff" stroke="#1f2a24" stroke-width="3"/><rect x="80" y="110" width="700" height="80" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="430" y="148" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Top shelf: archive and backstock</text><text x="430" y="170" font-size="14" text-anchor="middle" fill="#5b6b62">lidded bins, tax files, spare paper</text><rect x="80" y="205" width="700" height="90" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="430" y="248" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Eye-level shelf: daily supplies</text><text x="430" y="270" font-size="14" text-anchor="middle" fill="#5b6b62">open bins, mesh organizer, binders you use weekly</text><rect x="80" y="310" width="160" height="150" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="160" y="383" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Side wall</text><text x="160" y="405" font-size="14" text-anchor="middle" fill="#5b6b62">hanging pockets</text><rect x="620" y="310" width="160" height="150" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="700" y="383" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Side wall</text><text x="700" y="405" font-size="14" text-anchor="middle" fill="#5b6b62">cords, headphones</text><rect x="255" y="330" width="350" height="110" rx="6" fill="#fff" stroke="#5b6b62" stroke-dasharray="6 5"/><text x="430" y="380" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Monitor or laptop</text><text x="430" y="404" font-size="14" font-weight="400" text-anchor="middle" fill="#5b6b62">top of screen at or below eye level</text><rect x="70" y="470" width="720" height="22" fill="#1B5E3B"/><text x="430" y="487" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Desk surface spans the full closet width</text><rect x="80" y="505" width="120" height="115" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="140" y="560.5" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Slim</text><text x="140" y="582.5" font-size="14" text-anchor="middle" fill="#5b6b62">file cart</text><rect x="215" y="505" width="565" height="115" rx="8" fill="#fff" stroke="#E07A2E" stroke-width="2" stroke-dasharray="8 6"/><text x="497" y="555" font-size="18" font-weight="700" text-anchor="middle" fill="#E07A2E">Knee zone: keep it clear</text><text x="497" y="580" font-size="14" font-weight="400" text-anchor="middle" fill="#5b6b62">no bins, no tower, no power strip on the floor</text><rect x="840" y="95" width="320" height="540" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="860" y="135" font-size="19" font-weight="700" text-anchor="start" fill="#1B5E3B">Rules of thumb</text><text x="860" y="175" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">1. Measure the closet inside the</text><text x="860" y="197" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    frame, not the door opening</text><text x="860" y="237" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">2. Daily items between shoulder</text><text x="860" y="259" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    and desk height</text><text x="860" y="299" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">3. Backstock goes up, not under</text><text x="860" y="321" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    the desk</text><text x="860" y="361" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">4. Monitor at least 20 in. away</text><text x="860" y="383" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    (OSHA workstation guidance)</text><text x="860" y="423" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">5. One light over the desk so</text><text x="860" y="445" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    shelves do not shade you</text><text x="860" y="485" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">6. Route cords down one side</text><text x="860" y="507" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    wall to a single outlet</text></svg>