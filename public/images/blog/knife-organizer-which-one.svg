<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Which knife organizer fits your kitchen"><title>Which knife organizer fits your kitchen</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B" text-anchor="start">Which knife organizer fits your kitchen</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A2E"/></marker></defs><rect x="60" y="100" width="340" height="110" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="230" y="149" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">Do small children</text><text x="230" y="173" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">live or visit here?</text><rect x="60" y="270" width="340" height="110" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="230" y="319" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">Do you have a free</text><text x="230" y="343" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">drawer near the prep area?</text><rect x="60" y="440" width="340" height="110" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="230" y="489" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">Do you have a dry</text><text x="230" y="513" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">wall away from sink and stove?</text><line x1="230" y1="210" x2="230" y2="266" stroke="#E07A2E" stroke-width="3" marker-end="url(#a)"/><text x="244" y="245" font-size="17" font-weight="700" fill="#E07A2E" text-anchor="start">No</text><line x1="230" y1="380" x2="230" y2="436" stroke="#E07A2E" stroke-width="3" marker-end="url(#a)"/><text x="244" y="415" font-size="17" font-weight="700" fill="#E07A2E" text-anchor="start">No</text><line x1="400" y1="155" x2="556" y2="155" stroke="#E07A2E" stroke-width="3" marker-end="url(#a)"/><text x="460" y="143" font-size="17" font-weight="700" fill="#E07A2E" text-anchor="start">Yes</text><line x1="400" y1="325" x2="556" y2="325" stroke="#E07A2E" stroke-width="3" marker-end="url(#a)"/><text x="460" y="313" font-size="17" font-weight="700" fill="#E07A2E" text-anchor="start">Yes</text><line x1="400" y1="495" x2="556" y2="495" stroke="#E07A2E" stroke-width="3" marker-end="url(#a)"/><text x="460" y="483" font-size="17" font-weight="700" fill="#E07A2E" text-anchor="start">Yes</text><rect x="560" y="100" width="590" height="110" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="855" y="149" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">In-drawer dock in a latched drawer,</text><text x="855" y="173" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">or a strip mounted out of reach</text><rect x="560" y="270" width="590" height="110" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="855" y="319" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">In-drawer dock, with long blades</text><text x="855" y="343" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">along one wall</text><rect x="560" y="440" width="590" height="110" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="855" y="489" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">Magnetic strip, spine first,</text><text x="855" y="513" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">tips down</text><line x1="230" y1="550" x2="230" y2="612" stroke="#E07A2E" stroke-width="3"/><line x1="230" y1="612" x2="556" y2="612" stroke="#E07A2E" stroke-width="3" marker-end="url(#a)"/><text x="244" y="590" font-size="17" font-weight="700" fill="#E07A2E" text-anchor="start">No</text><rect x="560" y="580" width="590" height="62" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="855" y="617" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">Compact block, well back from the counter edge</text></svg>