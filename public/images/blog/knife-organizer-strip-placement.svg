ke-width="2" stroke-dasharray="7 6"/><text x="985" y="230" font-size="17" font-weight="700" fill="#E07A2E" text-anchor="middle">Steam and heat</text><text x="985" y="256" font-size="16" font-weight="400" fill="#E07A2E" text-anchor="middle">Keep the strip clear</text><rect x="430" y="150" width="340" height="24" rx="4" fill="#3b4a42" stroke="#3b4a42" stroke-width="2"/><rect x="462" y="168" width="20" height="52" rx="4" fill="#3b4a42"/><path d="M462,220 L482,220 L478,306 L462,288 z" fill="#c9d2cd" stroke="#7f8d86"/><rect x="524" y="168" width="20" height="52" rx="4" fill="#3b4a42"/><path d="M524,220 L544,220 L540,350 L524,332 z" fill="#c9d2cd" stroke="#7f8d86"/><rect x="586" y="168" width="20" height="52" rx="4" fill="#3b4a42"/><path d="M586,220 L606,220 L602,306 L586,288 z" fill="#c9d2cd" stroke="#7f8d86"/><rect x="648" y="168" width="20" height="52" rx="4" fill="#3b4a42"/><path d="M648,220 L668,220 L664,350 L648,332 z" fill="#c9d2cd" stroke="#7f8d86"/><rect x="710" y="168" width="20" height="52" rx="4" fill="#3b4a42"/><path d="M710,220 L730,220 L726,306 L710,288 z" fill="#c9d2cd" stroke="#7f8d86"/><text x="600" y="134" font-size="17" font-weight="700" fill="#1B5E3B" text-anchor="middle">Magnetic strip on a dry stretch of wall</text><text x="600" y="392" font-size="16" font-weight="400" fill="#4b5a52" text-anchor="middle">Tips down, edges all facing the same way</text><text x="600" y="416" font-size="16" font-weight="400" fill="#4b5a52" text-anchor="middle">Hang above reach of small children</text></svg>