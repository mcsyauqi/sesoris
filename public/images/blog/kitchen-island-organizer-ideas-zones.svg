<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Kitchen island zones and clearances"><title>Kitchen island zones and clearances</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Kitchen island zones and clearances</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A2E"/></marker></defs><rect x="60" y="100" width="700" height="56" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="410" y="134" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a24">Perimeter counter: sink and cooktop side</text><line x1="410" y1="162" x2="410" y2="238" stroke="#E07A2E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="425" y="205" font-size="15" font-weight="700" text-anchor="start" fill="#E07A2E">Work aisle: 42 in. (one cook), 48 in. (two or more)</text><rect x="120" y="244" width="580" height="210" rx="8" fill="#fff" stroke="#1f2a24" stroke-width="3"/><rect x="135" y="258" width="180" height="110" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="225" y="311" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Prep drawers</text><text x="225" y="333" font-size="14" text-anchor="middle" fill="#5b6b62">knives, tools, boards</text><rect x="325" y="258" width="180" height="110" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="415" y="311" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Pull-out bins</text><text x="415" y="333" font-size="14" text-anchor="middle" fill="#5b6b62">trash and recycling</text><rect x="515" y="258" width="170" height="110" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="600" y="311" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Pots and pans</text><text x="600" y="333" font-size="14" text-anchor="middle" fill="#5b6b62">deep drawers</text><rect x="135" y="378" width="550" height="62" rx="6" fill="#f6f7f4" stroke="#1B5E3B" stroke-width="2" stroke-dasharray="8 6"/><text x="410" y="415" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a24">Seating overhang: keep this side clear of storage</text><circle cx="210" cy="490" r="20" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><circle cx="410" cy="490" r="20" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><circle cx="610" cy="490" r="20" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><line x1="210" y1="530" x2="410" y2="530" stroke="#E07A2E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="310" y="556" font-size="15" font-weight="700" text-anchor="middle" fill="#E07A2E">24 in. per seat</text><rect x="60" y="600" width="700" height="14" fill="#cfd8d2"/><text x="410" y="640" font-size="14" font-weight="400" text-anchor="middle" fill="#5b6b62">Wall or other obstruction behind the seats</text><line x1="700" y1="460" x2="700" y2="596" stroke="#E07A2E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="712" y="520" font-size="14" font-weight="700" text-anchor="start" fill="#E07A2E">Behind seats:</text><text x="712" y="540" font-size="14" font-weight="700" text-anchor="start" fill="#E07A2E">36 in. to edge past,</text><text x="712" y="560" font-size="14" font-weight="700" text-anchor="start" fill="#E07A2E">44 in. to walk past</text><rect x="860" y="100" width="300" height="440" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="880" y="140" font-size="19" font-weight="700" text-anchor="start" fill="#1B5E3B">Island end cap</text><text x="880" y="176" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Open shelves for cookbooks,</text><text x="880" y="198" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">bowls or a small wine rack</text><text x="880" y="246" font-size="19" font-weight="700" text-anchor="start" fill="#1B5E3B">Walkway (not a work zone)</text><text x="880" y="282" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">At least 36 in. wide</text><text x="880" y="330" font-size="19" font-weight="700" text-anchor="start" fill="#1B5E3B">Countertop</text><text x="880" y="366" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">One tray for daily items,</text><text x="880" y="388" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">the rest stays clear</text><text x="880" y="470" font-size="13" font-weight="400" text-anchor="start" fill="#5b6b62">Clearances: NKBA kitchen</text><text x="880" y="490" font-size="13" font-weight="400" text-anchor="start" fill="#5b6b62">planning guidelines, via Fine</text><text x="880" y="510" font-size="13" font-weight="400" text-anchor="start" fill="#5b6b62">Homebuilding and CRD Design Build</text></svg>