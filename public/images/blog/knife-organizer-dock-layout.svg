<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="In-drawer knife organizer layout, top view"><title>In-drawer knife organizer layout, top view</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B" text-anchor="start">In-drawer knife organizer layout, top view</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A2E"/></marker></defs><rect x="60" y="100" width="760" height="530" rx="8" fill="#fff" stroke="#1f2a24" stroke-width="2"/><rect x="84" y="118" width="712" height="476" rx="8" fill="#e6cfa8" stroke="#a98a5a" stroke-width="2"/><text x="440" y="618" font-size="16" font-weight="400" fill="#4b5a52" text-anchor="middle">Drawer front, handles face you</text><g transform="rotate(-90 150 560)"><rect x="150" y="552" width="96" height="20" rx="4" fill="#3b4a42"/><path d="M246,552 L542,555 Q423.6,578 246,577 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/></g><g transform="rotate(-90 240 560)"><rect x="240" y="552" width="96" height="20" rx="4" fill="#3b4a42"/><path d="M336,552 L646.8,555 Q522.48,578 336,577 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/></g><g transform="rotate(-90 330 560)"><rect x="330" y="552" width="96" height="20" rx="4" fill="#3b4a42"/><path d="M426,552 L729.4,555 Q608.04,578 426,577 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/></g><g transform="rotate(-90 420 560)"><rect x="420" y="552" width="96" height="20" rx="4" fill="#3b4a42"/><path d="M516,552 L752.8,555 Q658.08,578 516,577 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/></g><g transform="rotate(-90 510 560)"><rect x="510" y="552" width="96" height="20" rx="4" fill="#3b4a42"/><path d="M606,552 L791,555 Q717,578 606,577 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/></g><g transform="rotate(-90 600 560)"><rect x="600" y="552" width="96" height="20" rx="4" fill="#3b4a42"/><path d="M696,552 L814.4,555 Q767.04,578 696,577 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/></g><g transform="rotate(-90 690 560)"><rect x="690" y="552" width="96" height="20" rx="4" fill="#3b4a42"/><path d="M786,552 L941.4,555 Q879.24,578 786,577 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/></g><text x="880" y="124" font-size="21" font-weight="700" fill="#1B5E3B" text-anchor="start">How to place them</text><circle cx="896" cy="164" r="15" fill="#E07A2E"/><text x="896" y="170" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="922" y="170" font-size="16" font-weight="700" fill="#1f2a24" text-anchor="start">Long blades go along one</text><text x="922" y="192" font-size="16" font-weight="700" fill="#1f2a24" text-anchor="start">wall</text><text x="922" y="216" font-size="15" font-weight="400" fill="#4b5a52" text-anchor="start">Chef, slicer and bread knife</text><text x="922" y="236" font-size="15" font-weight="400" fill="#4b5a52" text-anchor="start">sit where the drawer is deepest.</text><circle cx="896" cy="276" r="15" fill="#E07A2E"/><text x="896" y="282" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="922" y="282" font-size="16" font-weight="700" fill="#1f2a24" text-anchor="start">Middle sizes go in the</text><text x="922" y="304" font-size="16" font-weight="700" fill="#1f2a24" text-anchor="start">center</text><text x="922" y="328" font-size="15" font-weight="400" fill="#4b5a52" text-anchor="start">Santoku and utility stay</text><text x="922" y="348" font-size="15" font-weight="400" fill="#4b5a52" text-anchor="start">easy to grab first.</text><circle cx="896" cy="388" r="15" fill="#E07A2E"/><text x="896" y="394" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="922" y="394" font-size="16" font-weight="700" fill="#1f2a24" text-anchor="start">Short blades go in the</text><text x="922" y="416" font-size="16" font-weight="700" fill="#1f2a24" text-anchor="start">last slots</text><text x="922" y="440" font-size="15" font-weight="400" fill="#4b5a52" text-anchor="start">Paring and boning knives</text><text x="922" y="460" font-size="15" font-weight="400" fill="#4b5a52" text-anchor="start">never sit under a long blade.</text><circle cx="896" cy="500" r="15" fill="#E07A2E"/><text x="896" y="506" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="922" y="506" font-size="16" font-weight="700" fill="#1f2a24" text-anchor="start">Handles face the front</text><text x="922" y="552" font-size="15" font-weight="400" fill="#4b5a52" text-anchor="start">You grip the handle first and</text><text x="922" y="572" font-size="15" font-weight="400" fill="#4b5a52" text-anchor="start">your fingers stay off the edge.</text></svg>