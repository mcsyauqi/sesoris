<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Top drawer layout"><title>Top drawer layout</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Top drawer layout</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="60" y="100" width="700" height="520" rx="10" fill="#fff" stroke="#1f2a24" stroke-width="3"/><text x="410" y="645" font-size="15" text-anchor="middle" fill="#5b6b62">Front of drawer (you stand here)</text><rect x="80" y="120" width="300" height="140" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="230" y="188" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a24">Cotton pads, swabs</text><text x="230" y="210" font-size="13" text-anchor="middle" fill="#5b6b62">backups at the back</text><rect x="400" y="120" width="340" height="140" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="570" y="188" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a24">Weekly items</text><text x="570" y="210" font-size="13" text-anchor="middle" fill="#5b6b62">masks, nail kit</text><rect x="80" y="280" width="200" height="320" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="180" y="438" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a24">Skincare</text><text x="180" y="460" font-size="13" text-anchor="middle" fill="#5b6b62">bottles standing upright</text><rect x="300" y="280" width="200" height="150" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="400" y="353" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a24">Hair ties, pins</text><text x="400" y="375" font-size="13" text-anchor="middle" fill="#5b6b62">small lidded box</text><rect x="300" y="450" width="200" height="150" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="400" y="523" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a24">Deodorant</text><text x="400" y="545" font-size="13" text-anchor="middle" fill="#5b6b62">daily</text><rect x="520" y="280" width="220" height="320" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="630" y="438" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a24">Toothbrush, paste</text><text x="630" y="460" font-size="13" text-anchor="middle" fill="#5b6b62">front and center, daily</text><rect x="800" y="100" width="360" height="130" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="814" y="128" font-size="18" font-weight="700" fill="#1f2a24">Front = daily</text><text x="814" y="152" font-size="15" fill="#5b6b62">Put what you use every</text><text x="814" y="173" font-size="15" fill="#5b6b62">morning closest to you.</text><rect x="800" y="245" width="360" height="130" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="814" y="273" font-size="18" font-weight="700" fill="#1f2a24">Back = backups</text><text x="814" y="297" font-size="15" fill="#5b6b62">Refills and weekly items</text><text x="814" y="318" font-size="15" fill="#5b6b62">go to the back row.</text><rect x="800" y="390" width="360" height="130" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="814" y="418" font-size="18" font-weight="700" fill="#1f2a24">Mix tray sizes</text><text x="814" y="442" font-size="15" fill="#5b6b62">Modular trays fill the</text><text x="814" y="463" font-size="15" fill="#5b6b62">drawer with no gaps.</text><rect x="800" y="535" width="360" height="85" rx="10" fill="#fff" stroke="#E07A2E" stroke-width="2"/><text x="814" y="563" font-size="18" font-weight="700" fill="#1f2a24">Lids for tiny items</text><text x="814" y="587" font-size="15" fill="#5b6b62">Pins and ties stay put.</text></svg>
