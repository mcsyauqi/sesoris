<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="What to measure before buying a knife organizer"><title>What to measure before buying a knife organizer</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B" text-anchor="start">What to measure before buying a knife organizer</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A2E"/></marker></defs><text x="60" y="112" font-size="19" font-weight="700" fill="#1f2a24" text-anchor="start">Top view of the open drawer</text><rect x="60" y="130" width="640" height="340" rx="8" fill="#fff" stroke="#1f2a24" stroke-width="2"/><rect x="84" y="154" width="592" height="292" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><line x1="84" y1="500" x2="676" y2="500" stroke="#E07A2E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="380" y="528" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="middle">A. Inside width, wall to wall</text><line x1="730" y1="154" x2="730" y2="446" stroke="#E07A2E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="746" y="276" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="start">B. Inside</text><text x="746" y="300" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="start">depth, front</text><text x="746" y="324" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="start">to back</text><rect x="130" y="280" width="130" height="22" rx="4" fill="#3b4a42"/><path d="M260,280 L590,283.3 Q458,308 260,307 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/><line x1="130" y1="340" x2="590" y2="340" stroke="#1B5E3B" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="360" y="372" font-size="17" font-weight="700" fill="#1B5E3B" text-anchor="middle">D. Longest knife, tip to end of handle</text><text x="60" y="572" font-size="18" font-weight="400" fill="#4b5a52" text-anchor="start">Measure inside the drawer box with the drawer fully open.</text><text x="60" y="600" font-size="18" font-weight="400" fill="#4b5a52" text-anchor="start">Label sizes count the blade only, so measure the whole knife.</text><text x="900" y="112" font-size="19" font-weight="700" fill="#1f2a24" text-anchor="start">Side view</text><rect x="900" y="150" width="240" height="150" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><rect x="900" y="130" width="240" height="20" fill="#fff" stroke="#1f2a24" stroke-width="2"/><text x="1020" y="145" font-size="14" font-weight="400" fill="#4b5a52" text-anchor="middle">Drawer above</text><rect x="916" y="240" width="150" height="50" rx="4" fill="#e6cfa8" stroke="#a98a5a" stroke-width="2"/><line x1="1100" y1="152" x2="1100" y2="298" stroke="#E07A2E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="900" y="340" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="start">C. Clear height, from</text><text x="900" y="364" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="start">the drawer floor to</text><text x="900" y="388" font-size="17" font-weight="700" fill="#1f2a24" text-anchor="start">what sits above it</text></svg>