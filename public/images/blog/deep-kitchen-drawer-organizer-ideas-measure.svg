<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="What to measure before buying a deep drawer organizer"><title>What to measure before buying a deep drawer organizer</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">What to measure before buying a deep drawer organizer</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A2E"/></marker></defs><rect x="120" y="150" width="620" height="380" rx="6" fill="#fff" stroke="#1f2a24" stroke-width="3"/><rect x="100" y="120" width="660" height="30" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="430" y="141" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a24">Countertop or drawer above</text><rect x="135" y="235" width="590" height="280" rx="4" fill="#f6f7f4" stroke="#1B5E3B" stroke-width="2" stroke-dasharray="8 6"/><text x="430" y="380" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Usable interior (inside the drawer box)</text><line x1="140" y1="215" x2="720" y2="215" stroke="#E07A2E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="430" y="205" font-size="15" font-weight="700" text-anchor="middle" fill="#E07A2E">A. Interior width, wall to wall</text><line x1="760" y1="240" x2="760" y2="512" stroke="#E07A2E" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/><text x="760" y="556" font-size="15" font-weight="700" text-anchor="middle" fill="#E07A2E">B. Interior height</text><text x="760" y="576" font-size="14" font-weight="400" text-anchor="middle" fill="#5b6b62">to the drawer rim</text><rect x="860" y="130" width="300" height="420" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="880" y="170" font-size="19" font-weight="700" text-anchor="start" fill="#1B5E3B">Write down</text><text x="880" y="210" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">A. Interior width</text><text x="880" y="240" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">B. Interior height</text><text x="880" y="270" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">C. Interior depth, front to back</text><text x="880" y="300" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">D. Clearance under the part</text><text x="880" y="322" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    above when the drawer closes</text><text x="880" y="362" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Then measure your tallest pot</text><text x="880" y="384" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">with its handle and lid.</text><text x="880" y="424" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Measure inside the box, not</text><text x="880" y="446" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">the drawer front: fronts are</text><text x="880" y="468" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">wider and taller than the box.</text><text x="400" y="620" font-size="15" font-weight="400" text-anchor="middle" fill="#5b6b62">C. Depth runs front to back (into the page): measure it with the drawer fully open.</text></svg>