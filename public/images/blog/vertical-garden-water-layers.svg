<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="How a wall-mounted vertical garden handles water"><title>How a wall-mounted vertical garden handles water</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B" text-anchor="start">How a wall-mounted vertical garden handles water</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="90" y="100" width="60" height="500" fill="#d9d4cb"/><text x="120" y="625" font-size="16" font-weight="700" fill="#1f2a24" text-anchor="middle">Wall</text><rect x="150" y="100" width="14" height="480" fill="#3c6e8f"/><rect x="164" y="120" width="22" height="16" fill="#9aa59d"/><rect x="164" y="200" width="22" height="16" fill="#9aa59d"/><rect x="164" y="280" width="22" height="16" fill="#9aa59d"/><rect x="164" y="360" width="22" height="16" fill="#9aa59d"/><rect x="164" y="440" width="22" height="16" fill="#9aa59d"/><rect x="164" y="520" width="22" height="16" fill="#9aa59d"/><rect x="186" y="100" width="40" height="480" fill="#6b6f6a"/><path d="M226,130 h70 v70 q-35,22 -70,0 z" fill="#8c918b"/><rect x="230" y="136" width="62" height="40" fill="#8a6a48"/><ellipse cx="248.1" cy="124.0" rx="9" ry="5" transform="rotate(-150 248.1 124.0)" fill="#2f7a46"/><ellipse cx="254.0" cy="118.1" rx="9" ry="5" transform="rotate(-120 254.0 118.1)" fill="#4f9a62"/><ellipse cx="262.0" cy="116.0" rx="9" ry="5" transform="rotate(-90 262.0 116.0)" fill="#2f7a46"/><ellipse cx="270.0" cy="118.1" rx="9" ry="5" transform="rotate(-60 270.0 118.1)" fill="#4f9a62"/><ellipse cx="275.9" cy="124.0" rx="9" ry="5" transform="rotate(-30 275.9 124.0)" fill="#2f7a46"/><path d="M226,242 h70 v70 q-35,22 -70,0 z" fill="#8c918b"/><rect x="230" y="248" width="62" height="40" fill="#8a6a48"/><ellipse cx="248.1" cy="236.0" rx="9" ry="5" transform="rotate(-150 248.1 236.0)" fill="#2f7a46"/><ellipse cx="254.0" cy="230.1" rx="9" ry="5" transform="rotate(-120 254.0 230.1)" fill="#4f9a62"/><ellipse cx="262.0" cy="228.0" rx="9" ry="5" transform="rotate(-90 262.0 228.0)" fill="#2f7a46"/><ellipse cx="270.0" cy="230.1" rx="9" ry="5" transform="rotate(-60 270.0 230.1)" fill="#4f9a62"/><ellipse cx="275.9" cy="236.0" rx="9" ry="5" transform="rotate(-30 275.9 236.0)" fill="#2f7a46"/><path d="M226,354 h70 v70 q-35,22 -70,0 z" fill="#8c918b"/><rect x="230" y="360" width="62" height="40" fill="#8a6a48"/><ellipse cx="248.1" cy="348.0" rx="9" ry="5" transform="rotate(-150 248.1 348.0)" fill="#2f7a46"/><ellipse cx="254.0" cy="342.1" rx="9" ry="5" transform="rotate(-120 254.0 342.1)" fill="#4f9a62"/><ellipse cx="262.0" cy="340.0" rx="9" ry="5" transform="rotate(-90 262.0 340.0)" fill="#2f7a46"/><ellipse cx="270.0" cy="342.1" rx="9" ry="5" transform="rotate(-60 270.0 342.1)" fill="#4f9a62"/><ellipse cx="275.9" cy="348.0" rx="9" ry="5" transform="rotate(-30 275.9 348.0)" fill="#2f7a46"/><path d="M226,466 h70 v70 q-35,22 -70,0 z" fill="#8c918b"/><rect x="230" y="472" width="62" height="40" fill="#8a6a48"/><ellipse cx="248.1" cy="460.0" rx="9" ry="5" transform="rotate(-150 248.1 460.0)" fill="#2f7a46"/><ellipse cx="254.0" cy="454.1" rx="9" ry="5" transform="rotate(-120 254.0 454.1)" fill="#4f9a62"/><ellipse cx="262.0" cy="452.0" rx="9" ry="5" transform="rotate(-90 262.0 452.0)" fill="#2f7a46"/><ellipse cx="270.0" cy="454.1" rx="9" ry="5" transform="rotate(-60 270.0 454.1)" fill="#4f9a62"/><ellipse cx="275.9" cy="460.0" rx="9" ry="5" transform="rotate(-30 275.9 460.0)" fill="#2f7a46"/><rect x="186" y="92" width="150" height="10" rx="5" fill="#E07A2E"/><path d="M300,200 q14,20 0,40" fill="none" stroke="#3c6e8f" stroke-width="3" stroke-dasharray="6 5"/><path d="M300,312 q14,20 0,40" fill="none" stroke="#3c6e8f" stroke-width="3" stroke-dasharray="6 5"/><path d="M300,424 q14,20 0,40" fill="none" stroke="#3c6e8f" stroke-width="3" stroke-dasharray="6 5"/><path d="M300,536 q14,20 0,40" fill="none" stroke="#3c6e8f" stroke-width="3" stroke-dasharray="6 5"/><path d="M170,580 h200 l-12,26 h-176 z" fill="#3c6e8f" opacity="0.85"/><line x1="330" y1="97" x2="512" y2="110" stroke="#E07A2E" stroke-width="2"/><circle cx="330" cy="97" r="4" fill="#E07A2E"/><text x="520" y="116" font-size="19" font-weight="700" fill="#1B5E3B" text-anchor="start">1. Water goes in at the top</text><text x="520" y="142" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">A drip line or a watering can at the top row; water</text><text x="520" y="164" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">then moves down from row to row.</text><line x1="157" y1="220" x2="512" y2="210" stroke="#E07A2E" stroke-width="2"/><circle cx="157" cy="220" r="4" fill="#E07A2E"/><text x="520" y="216" font-size="19" font-weight="700" fill="#1B5E3B" text-anchor="start">2. Waterproof backing</text><text x="520" y="242" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">A sheet or liner between the planter and the wall</text><text x="520" y="264" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">keeps moisture off paint, drywall and wood.</text><line x1="175" y1="290" x2="512" y2="310" stroke="#E07A2E" stroke-width="2"/><circle cx="175" cy="290" r="4" fill="#E07A2E"/><text x="520" y="316" font-size="19" font-weight="700" fill="#1B5E3B" text-anchor="start">3. Air gap and spacers</text><text x="520" y="342" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">A small gap lets the wall behind dry out and</text><text x="520" y="364" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">stops mold from starting where you cannot see.</text><line x1="296" y1="160" x2="512" y2="410" stroke="#E07A2E" stroke-width="2"/><circle cx="296" cy="160" r="4" fill="#E07A2E"/><text x="520" y="416" font-size="19" font-weight="700" fill="#1B5E3B" text-anchor="start">4. Top rows dry first</text><text x="520" y="442" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">Put plants that like to dry out up high and</text><text x="520" y="464" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">moisture lovers near the bottom.</text><line x1="330" y1="594" x2="512" y2="510" stroke="#E07A2E" stroke-width="2"/><circle cx="330" cy="594" r="4" fill="#E07A2E"/><text x="520" y="516" font-size="19" font-weight="700" fill="#1B5E3B" text-anchor="start">5. Drip tray at the base</text><text x="520" y="542" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">Catch the runoff so the floor stays dry. Empty it,</text><text x="520" y="564" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">or reuse the water on the next round.</text><text x="520" y="625" font-size="15" font-weight="400" fill="#55605a" text-anchor="start">Sesoris diagram. Based on Mississippi State, Arkansas and NC State extension guidance.</text></svg>