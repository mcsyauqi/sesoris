<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Three ways to fill a deep drawer"><title>Three ways to fill a deep drawer</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Three ways to fill a deep drawer</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="40" y="110" width="350" height="500" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="215" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#1B5E3B">Nesting</text><text x="64" y="200" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Pots stacked inside</text><text x="64" y="234" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">each other, largest first</text><text x="64" y="268" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24"></text><text x="64" y="302" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Best for: sets that</text><text x="64" y="336" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">nest by design</text><text x="64" y="370" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24"></text><text x="64" y="404" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Watch out: you lift the</text><text x="64" y="438" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">top pots to reach the</text><text x="64" y="472" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">bottom one</text><text x="64" y="506" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24"></text><text x="64" y="540" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Tip: a pan protector or</text><text x="64" y="574" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">cloth between pieces</text><rect x="425" y="110" width="350" height="500" rx="10" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="600" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#1B5E3B">Filing on edge</text><text x="449" y="200" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Pans, lids, trays and</text><text x="449" y="234" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">sheet pans stand upright</text><text x="449" y="268" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">in a rack or divider</text><text x="449" y="302" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24"></text><text x="449" y="336" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Best for: flat items</text><text x="449" y="370" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">and lids</text><text x="449" y="404" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24"></text><text x="449" y="438" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Watch out: the rack must</text><text x="449" y="472" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">fit under the counter</text><text x="449" y="506" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">when the drawer closes</text><text x="449" y="540" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24"></text><text x="449" y="574" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Tip: tall items at the back</text><rect x="810" y="110" width="350" height="500" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="985" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#1B5E3B">Pegs and bins</text><text x="834" y="200" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Adjustable pegs hold</text><text x="834" y="234" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">plates and bowls in place;</text><text x="834" y="268" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">open bins corral</text><text x="834" y="302" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">small containers</text><text x="834" y="336" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24"></text><text x="834" y="370" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Best for: dishes stored</text><text x="834" y="404" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">low, food containers</text><text x="834" y="438" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24"></text><text x="834" y="472" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Watch out: weight adds up</text><text x="834" y="506" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">with stacks of plates</text><text x="834" y="540" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24"></text><text x="834" y="574" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Tip: one bin per category</text></svg>