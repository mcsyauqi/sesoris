<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Bathroom vanity storage zones"><title>Bathroom vanity storage zones</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Bathroom vanity storage zones</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="60" y="120" width="560" height="22" rx="4" fill="#c9d3cc"/><ellipse cx="340" cy="131" rx="70" ry="9" fill="#fff" stroke="#5b6b62"/><rect x="150" y="96" width="70" height="24" rx="4" fill="#e3efe7" stroke="#1B5E3B"/><text x="185" y="90" font-size="13" text-anchor="middle" fill="#1f2a24">tray</text><rect x="70" y="142" width="540" height="430" fill="#fff" stroke="#1f2a24" stroke-width="3"/><rect x="70" y="142" width="170" height="110" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="155" y="192" font-size="15" text-anchor="middle" fill="#1f2a24">Top drawer</text><text x="155" y="214" font-size="13" text-anchor="middle" fill="#5b6b62">daily items</text><rect x="70" y="252" width="170" height="150" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="155" y="322" font-size="15" text-anchor="middle" fill="#1f2a24">2nd drawer</text><text x="155" y="344" font-size="13" text-anchor="middle" fill="#5b6b62">hair tools, brushes</text><rect x="70" y="402" width="170" height="170" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="155" y="487" font-size="15" text-anchor="middle" fill="#1f2a24">3rd drawer</text><text x="155" y="509" font-size="13" text-anchor="middle" fill="#5b6b62">backups</text><path d="M340 142 V300 Q340 330 370 330 H420 V380" fill="none" stroke="#5b6b62" stroke-width="10"/><text x="430" y="300" font-size="13" fill="#5b6b62">drain pipe</text><rect x="260" y="420" width="70" height="140" fill="none" stroke="#E07A2E" stroke-width="2"/><rect x="460" y="420" width="130" height="140" fill="none" stroke="#E07A2E" stroke-width="2"/><text x="295" y="595" font-size="13" text-anchor="middle" fill="#E07A2E">pull-out</text><text x="525" y="595" font-size="13" text-anchor="middle" fill="#E07A2E">pull-out organizer</text><rect x="660" y="100" width="20" height="0"/><rect x="680" y="95" width="480" height="95" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="694" y="123" font-size="18" font-weight="700" fill="#1f2a24">Countertop</text><text x="694" y="147" font-size="15" fill="#5b6b62">One tray of daily items, matching dispensers.</text><text x="694" y="168" font-size="15" fill="#5b6b62">Keep at least half the counter clear.</text><rect x="680" y="205" width="480" height="95" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="694" y="233" font-size="18" font-weight="700" fill="#1f2a24">Drawers, top to bottom</text><text x="694" y="257" font-size="15" fill="#5b6b62">Daily essentials first, then hair tools,</text><text x="694" y="278" font-size="15" fill="#5b6b62">then backups. Clear divider trays.</text><rect x="680" y="315" width="480" height="115" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="694" y="343" font-size="18" font-weight="700" fill="#1f2a24">Under the sink</text><text x="694" y="367" font-size="15" fill="#5b6b62">Two-tier pull-outs on each side of the drain.</text><text x="694" y="388" font-size="15" fill="#5b6b62">Leave shutoff valves reachable. Tray on the</text><text x="694" y="409" font-size="15" fill="#5b6b62">cabinet floor catches drips.</text><rect x="680" y="445" width="480" height="95" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="694" y="473" font-size="18" font-weight="700" fill="#1f2a24">Wall and mirror</text><text x="694" y="497" font-size="15" fill="#5b6b62">Shallow shelf, towel bar, mirrored cabinet</text><text x="694" y="518" font-size="15" fill="#5b6b62">for small items.</text><rect x="680" y="555" width="480" height="80" rx="10" fill="#fff" stroke="#E07A2E" stroke-width="2"/><text x="694" y="583" font-size="18" font-weight="700" fill="#1f2a24">Keep medicines elsewhere</text><text x="694" y="607" font-size="15" fill="#5b6b62">Heat and moisture can damage them.</text></svg>
