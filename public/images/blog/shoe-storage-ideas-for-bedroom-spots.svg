<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Six places to store shoes in a bedroom (floor plan)"><title>Six places to store shoes in a bedroom (floor plan)</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Six places to store shoes in a bedroom (floor plan)</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="60" y="95" width="760" height="540" fill="#fff" stroke="#1f2a24" stroke-width="4"/><rect x="250" y="110" width="330" height="290" rx="6" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="415" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="#1B5E3B">Bed</text><rect x="262" y="250" width="306" height="120" rx="6" fill="#fff" stroke="#E07A2E" stroke-width="2" stroke-dasharray="7 5"/><text x="415" y="300" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a24">1. Under the bed</text><text x="415" y="322" font-size="13" font-weight="400" text-anchor="middle" fill="#5b6b62">flat zip-top boxes, off-season pairs</text><rect x="265" y="415" width="300" height="60" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="415" y="443" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">2. Bench at the foot of the bed</text><text x="415" y="465" font-size="14" text-anchor="middle" fill="#5b6b62">daily pairs in open cubbies</text><rect x="75" y="110" width="150" height="230" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="150" y="223" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">3. Closet floor</text><text x="150" y="245" font-size="14" text-anchor="middle" fill="#5b6b62">rack or cubbies</text><rect x="660" y="110" width="145" height="140" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="732.5" y="178" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">4. Dresser</text><text x="732.5" y="200" font-size="14" text-anchor="middle" fill="#5b6b62">bottom drawer</text><rect x="705" y="500" width="100" height="120" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="755" y="558" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">5. Corner</text><text x="755" y="580" font-size="14" text-anchor="middle" fill="#5b6b62">narrow tower</text><path d="M75 635 L75 545 A90 90 0 0 1 165 635" fill="none" stroke="#5b6b62" stroke-width="2"/><rect x="180" y="540" width="220" height="80" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="290" y="578" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">6. Back of the door</text><text x="290" y="600" font-size="14" text-anchor="middle" fill="#5b6b62">over-door rack or pockets</text><rect x="860" y="95" width="300" height="540" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="880" y="135" font-size="19" font-weight="700" text-anchor="start" fill="#1B5E3B">How to choose</text><text x="880" y="175" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Daily pairs: bench or door,</text><text x="880" y="197" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">within two steps of where</text><text x="880" y="219" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">you sit to put them on</text><text x="880" y="259" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Off-season pairs: under the</text><text x="880" y="281" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">bed in covered boxes</text><text x="880" y="321" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Special pairs: closet shelf</text><text x="880" y="343" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">or a lidded box</text><text x="880" y="383" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Small room: go vertical,</text><text x="880" y="405" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">corner tower or door rack</text><text x="880" y="445" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Always: keep walkways and</text><text x="880" y="467" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">the door swing clear</text></svg>