<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Cat wall safety checklist"><title>Cat wall safety checklist</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Cat wall safety checklist</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="40" y="100" width="550" height="160" rx="12" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><circle cx="90" cy="180" r="26" fill="#1B5E3B"/><path d="M77 181 l9 10 l18 -20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="170" font-size="21" font-weight="700" fill="#1f2a24">Fixed into studs or rated anchors</text><text x="135" y="202" font-size="16" fill="#5b6b62">Press down hard on each shelf edge: no flex, no wobble.</text><rect x="610" y="100" width="550" height="160" rx="12" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><circle cx="660" cy="180" r="26" fill="#1B5E3B"/><path d="M647 181 l9 10 l18 -20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="705" y="170" font-size="21" font-weight="700" fill="#1f2a24">Grippy tops</text><text x="705" y="202" font-size="16" fill="#5b6b62">Carpet, felt or sisal on every landing surface.</text><rect x="40" y="280" width="550" height="160" rx="12" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><circle cx="90" cy="360" r="26" fill="#1B5E3B"/><path d="M77 361 l9 10 l18 -20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="350" font-size="21" font-weight="700" fill="#1f2a24">Two ways down</text><text x="135" y="382" font-size="16" fill="#5b6b62">No cat gets trapped at the top by another pet.</text><rect x="610" y="280" width="550" height="160" rx="12" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><circle cx="660" cy="360" r="26" fill="#1B5E3B"/><path d="M647 361 l9 10 l18 -20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="705" y="350" font-size="21" font-weight="700" fill="#1f2a24">Clear landing zones</text><text x="705" y="382" font-size="16" fill="#5b6b62">Nothing breakable, hot or dangling below the route.</text><rect x="40" y="460" width="550" height="160" rx="12" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><circle cx="90" cy="540" r="26" fill="#1B5E3B"/><path d="M77 541 l9 10 l18 -20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="530" font-size="21" font-weight="700" fill="#1f2a24">Safe windows</text><text x="135" y="562" font-size="16" fill="#5b6b62">Screened or closed windows near perches.</text><rect x="610" y="460" width="550" height="160" rx="12" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><circle cx="660" cy="540" r="26" fill="#1B5E3B"/><path d="M647 541 l9 10 l18 -20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="705" y="530" font-size="21" font-weight="700" fill="#1f2a24">Monthly wobble check</text><text x="705" y="562" font-size="16" fill="#5b6b62">Screws loosen after hundreds of jumps. Re-tighten.</text></svg>
