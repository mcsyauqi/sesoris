<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Match vertical garden plants to the light on your wall"><title>Match vertical garden plants to the light on your wall</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B" text-anchor="start">Match vertical garden plants to the light on your wall</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><text x="54" y="112" font-size="17" font-weight="700" fill="#1B5E3B" text-anchor="start">Light level</text><text x="264" y="112" font-size="17" font-weight="700" fill="#1B5E3B" text-anchor="start">Foot-candles</text><text x="434" y="112" font-size="17" font-weight="700" fill="#1B5E3B" text-anchor="start">Typical spot</text><text x="774" y="112" font-size="17" font-weight="700" fill="#1B5E3B" text-anchor="start">Plants that fit</text><rect x="40" y="128" width="1120" height="100" rx="8" fill="#dfe7e1"/><circle cx="70" cy="178" r="10" fill="#E07A2E" opacity="0.35"/><text x="96" y="184" font-size="19" font-weight="700" fill="#1f2a24" text-anchor="start">Low light</text><text x="264" y="184" font-size="18" font-weight="700" fill="#1B5E3B" text-anchor="start">25 to 100 fc</text><text x="434" y="172" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">North window, or a room lit</text><text x="434" y="194" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">mostly by lamps</text><text x="774" y="172" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">ZZ plant, snake plant, cast iron plant,</text><text x="774" y="194" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">peace lily</text><rect x="40" y="240" width="1120" height="100" rx="8" fill="#c7dccd"/><circle cx="70" cy="290" r="14" fill="#E07A2E" opacity="0.55"/><text x="96" y="296" font-size="19" font-weight="700" fill="#1f2a24" text-anchor="start">Medium-bright</text><text x="264" y="296" font-size="18" font-weight="700" fill="#1B5E3B" text-anchor="start">100 to 500 fc</text><text x="434" y="284" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">East or west window</text><text x="774" y="284" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">Chinese evergreen, rubber plant,</text><text x="774" y="306" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">dracaena, pothos</text><rect x="40" y="352" width="1120" height="100" rx="8" fill="#a9cdb3"/><circle cx="70" cy="402" r="18" fill="#E07A2E" opacity="0.75"/><text x="96" y="408" font-size="19" font-weight="700" fill="#1f2a24" text-anchor="start">High light</text><text x="264" y="408" font-size="18" font-weight="700" fill="#1B5E3B" text-anchor="start">500 to 1,000 fc</text><text x="434" y="396" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">South window or some west</text><text x="434" y="418" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">windows</text><text x="774" y="396" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">Croton, hibiscus, jade plant, hoya</text><rect x="40" y="464" width="1120" height="100" rx="8" fill="#86b994"/><circle cx="70" cy="514" r="22" fill="#E07A2E" opacity="0.9500000000000001"/><text x="96" y="520" font-size="19" font-weight="700" fill="#1f2a24" text-anchor="start">Direct sun</text><text x="264" y="520" font-size="18" font-weight="700" fill="#1B5E3B" text-anchor="start">Over 1,000 fc</text><text x="434" y="508" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">4 to 6 hours of direct sun,</text><text x="434" y="530" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">sunroom or bay window</text><text x="774" y="508" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">Citrus, succulents and cacti, gardenia</text><text x="40" y="600" font-size="15" font-weight="400" fill="#55605a" text-anchor="start">fc = foot-candles. A free light meter app gives a rough reading; check at noon and again late in the day.</text><text x="40" y="628" font-size="15" font-weight="400" fill="#55605a" text-anchor="start">Ranges and plant lists: University of Maryland Extension, Lighting for Indoor Plants. Pothos range: West Virginia University Extension.</text></svg>