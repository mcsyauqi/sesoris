<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Deep drawer layout, seen from above"><title>Deep drawer layout, seen from above</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Deep drawer layout, seen from above</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A2E"/></marker></defs><rect x="60" y="100" width="760" height="500" rx="10" fill="#fff" stroke="#1f2a24" stroke-width="3"/><text x="440" y="630" font-size="15" font-weight="400" text-anchor="middle" fill="#5b6b62">Front of drawer (you stand here)</text><rect x="80" y="120" width="300" height="260" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="230" y="248" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Pots, nested by size</text><text x="230" y="270" font-size="14" text-anchor="middle" fill="#5b6b62">largest at the bottom</text><rect x="400" y="120" width="400" height="120" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="600" y="178" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Lid divider</text><text x="600" y="200" font-size="14" text-anchor="middle" fill="#5b6b62">lids stand on edge</text><rect x="400" y="260" width="400" height="120" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="600" y="318" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Frying pans on edge</text><text x="600" y="340" font-size="14" text-anchor="middle" fill="#5b6b62">in a vertical pan rack</text><rect x="80" y="400" width="360" height="180" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="260" y="488" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Plates on pegs</text><text x="260" y="510" font-size="14" text-anchor="middle" fill="#5b6b62">adjustable peg board base</text><rect x="460" y="400" width="340" height="180" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="630" y="488" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2a24">Mixing bowls</text><text x="630" y="510" font-size="14" text-anchor="middle" fill="#5b6b62">stacked, handles turned in</text><rect x="860" y="100" width="300" height="500" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="880" y="140" font-size="19" font-weight="700" text-anchor="start" fill="#1B5E3B">Rules of thumb</text><text x="880" y="180" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">1. Heaviest items to the back</text><text x="880" y="210" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    and bottom of the drawer</text><text x="880" y="250" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">2. One category per zone</text><text x="880" y="290" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">3. Store on edge when you can,</text><text x="880" y="320" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    so nothing is buried</text><text x="880" y="360" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">4. Leave a finger gap at the</text><text x="880" y="390" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    front of every zone</text><text x="880" y="430" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">5. Check the drawer still</text><text x="880" y="460" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">    closes with the tallest pot</text></svg>