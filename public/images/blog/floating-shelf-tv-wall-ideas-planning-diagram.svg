<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Plan a floating shelf TV wall before you drill</title>
  <desc id="d">Wall elevation showing a mounted TV, taped shelf outlines, wall studs, an outlet and a planned cable route.</desc>
  <rect width="1200" height="675" fill="#F3F5F0"/>
  <text x="60" y="66" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#16352A">Plan the TV wall before you drill</text>
  <text x="60" y="98" font-family="Archivo, Arial, sans-serif" font-size="17" fill="#4A5A52">Tape every shelf at full size, mark studs and outlets, and plan the cable route first.</text>
  <!-- wall -->
  <rect x="60" y="130" width="760" height="470" rx="6" fill="#FFFFFF" stroke="#C9D3CC" stroke-width="2"/>
  <!-- studs -->
  <g stroke="#9DB3A6" stroke-width="2" stroke-dasharray="6 8">
    <line x1="140" y1="130" x2="140" y2="600"/>
    <line x1="260" y1="130" x2="260" y2="600"/>
    <line x1="380" y1="130" x2="380" y2="600"/>
    <line x1="500" y1="130" x2="500" y2="600"/>
    <line x1="620" y1="130" x2="620" y2="600"/>
    <line x1="740" y1="130" x2="740" y2="600"/>
  </g>
  <!-- TV -->
  <rect x="290" y="220" width="300" height="170" rx="6" fill="#1E2623"/>
  <!-- taped shelves -->
  <g fill="none" stroke="#E8743B" stroke-width="3" stroke-dasharray="10 6">
    <rect x="110" y="230" width="140" height="18" rx="2"/>
    <rect x="110" y="320" width="140" height="18" rx="2"/>
    <rect x="300" y="430" width="280" height="22" rx="2"/>
    <rect x="630" y="260" width="150" height="18" rx="2"/>
  </g>
  <!-- cable route -->
  <path d="M440 390 L440 430" stroke="#1B5E3B" stroke-width="5" stroke-linecap="round"/>
  <path d="M440 452 L440 545" stroke="#1B5E3B" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10"/>
  <!-- outlet -->
  <rect x="425" y="545" width="30" height="40" rx="4" fill="#FFFFFF" stroke="#4A5A52" stroke-width="2"/>
  <circle cx="440" cy="558" r="3" fill="#4A5A52"/>
  <circle cx="440" cy="572" r="3" fill="#4A5A52"/>
  <!-- gap marker -->
  <path d="M250 300 L290 300" stroke="#4A5A52" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5A52"/>
    </marker>
  </defs>
  <!-- legend -->
  <g font-family="Archivo, Arial, sans-serif" fill="#16352A">
    <line x1="860" y1="160" x2="900" y2="160" stroke="#9DB3A6" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="912" y="166" font-size="18" font-weight="700">Wall studs</text>
    <text x="912" y="190" font-size="15" fill="#4A5A52">Usually 16 in. apart on center</text>
    <text x="912" y="210" font-size="15" fill="#4A5A52">in US homes. Find and mark them.</text>
    <rect x="860" y="248" width="40" height="14" fill="none" stroke="#E8743B" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="912" y="262" font-size="18" font-weight="700">Painter's tape outline</text>
    <text x="912" y="286" font-size="15" fill="#4A5A52">Check the layout from the sofa</text>
    <text x="912" y="306" font-size="15" fill="#4A5A52">before any drilling.</text>
    <path d="M860 350 L900 350" stroke="#4A5A52" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="912" y="356" font-size="18" font-weight="700">Open wall gap</text>
    <text x="912" y="380" font-size="15" fill="#4A5A52">Keep shelves off the TV edge</text>
    <text x="912" y="400" font-size="15" fill="#4A5A52">so the screen can breathe.</text>
    <line x1="860" y1="444" x2="900" y2="444" stroke="#1B5E3B" stroke-width="5" stroke-linecap="round"/>
    <text x="912" y="450" font-size="18" font-weight="700">Cable route</text>
    <text x="912" y="474" font-size="15" fill="#4A5A52">Plan it with the layout, not after.</text>
    <rect x="868" y="514" width="24" height="32" rx="4" fill="#FFFFFF" stroke="#4A5A52" stroke-width="2"/>
    <text x="912" y="530" font-size="18" font-weight="700">Outlets and switches</text>
    <text x="912" y="554" font-size="15" fill="#4A5A52">Wiring often runs above and</text>
    <text x="912" y="574" font-size="15" fill="#4A5A52">below them. Do not drill there.</text>
  </g>
  <text x="60" y="636" font-family="Archivo, Arial, sans-serif" font-size="14" fill="#6B7A72">Sesoris planning sketch. Not to scale. Always follow your shelf and anchor load ratings.</text>
</svg>
