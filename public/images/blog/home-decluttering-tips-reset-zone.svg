<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0" />
      <stop offset="100%" stop-color="#F1ECE3" />
    </linearGradient>
    <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C7355" />
      <stop offset="50%" stop-color="#A68B6D" />
      <stop offset="100%" stop-color="#735C43" />
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6DFD3" />
      <stop offset="100%" stop-color="#CBBFA8" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#544E45" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg-grad)" />

  <!-- Wall Feature Stripe -->
  <rect x="0" y="0" width="1600" height="450" fill="#EAE3D5" opacity="0.6" />
  <line x1="0" y1="450" x2="1600" y2="450" stroke="#DFD7C7" stroke-width="2" />

  <!-- Entry Table -->
  <!-- Table shadow -->
  <ellipse cx="800" cy="580" rx="420" ry="20" fill="#D3C8B4" opacity="0.6" filter="blur(8px)" />
  <!-- Legs -->
  <rect x="420" y="520" width="24" height="260" fill="#5E4E3C" rx="4" />
  <rect x="1156" y="520" width="24" height="260" fill="#5E4E3C" rx="4" />
  <!-- Table Top -->
  <rect x="360" y="490" width="880" height="30" fill="url(#wood-grad)" rx="6" filter="url(#soft-shadow)" />

  <!-- Table Decor -->
  <!-- Ceramic Vase -->
  <path d="M 460 490 Q 440 400 465 340 L 485 340 Q 510 400 490 490 Z" fill="#D5C5B5" stroke="#BFA895" stroke-width="2" />
  <!-- Decorative Branches -->
  <path d="M 475 340 Q 460 250 430 200" fill="none" stroke="#8A7A6B" stroke-width="3" stroke-linecap="round" />
  <path d="M 475 330 Q 490 260 520 220" fill="none" stroke="#8A7A6B" stroke-width="2" stroke-linecap="round" />
  <circle cx="430" cy="200" r="5" fill="#A89482" />
  <circle cx="520" cy="220" r="4" fill="#A89482" />
  <circle cx="445" cy="240" r="5" fill="#A89482" />

  <!-- Bowl for Keys -->
  <path d="M 540 490 C 540 465 620 465 620 490 Z" fill="#EDE9E2" stroke="#D1C7BD" stroke-width="2" />
  <!-- Small items inside bowl (abstract) -->
  <ellipse cx="570" cy="480" rx="12" ry="4" fill="#B0A090" transform="rotate(-15, 570, 480)" />
  <circle cx="590" cy="482" r="6" fill="#7A6B5C" />

  <!-- Mirror Above Table -->
  <circle cx="800" cy="260" r="140" fill="none" stroke="#A68B6D" stroke-width="8" filter="url(#soft-shadow)" />
  <circle cx="800" cy="260" r="136" fill="#F4EFE6" opacity="0.7" />

  <!-- The Four Sorting Boxes (The Core Concept) -->
  <g filter="url(#soft-shadow)">
    <!-- Box 1: Keep -->
    <g transform="translate(250, 620)">
      <rect width="220" height="150" fill="url(#box-grad)" rx="8" />
      <rect x="15" y="15" width="190" height="120" fill="none" stroke="#A39681" stroke-width="2" stroke-dasharray="6,4" rx="4" />
      <path d="M 90 75 L 105 90 L 140 55" fill="none" stroke="#768A6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Box 2: Donate -->
    <g transform="translate(520, 620)">
      <rect width="220" height="150" fill="url(#box-grad)" rx="8" />
      <rect x="15" y="15" width="190" height="120" fill="none" stroke="#A39681" stroke-width="2" stroke-dasharray="6,4" rx="4" />
      <path d="M 110 50 C 110 50 140 70 110 95 C 80 70 110 50 110 50" fill="#C49A88" opacity="0.9" />
      <path d="M 110 50 C 110 50 80 70 110 95 C 140 70 110 50 110 50" fill="#C49A88" opacity="0.9" />
    </g>

    <!-- Box 3: Relocate -->
    <g transform="translate(790, 620)">
      <rect width="220" height="150" fill="url(#box-grad)" rx="8" />
      <rect x="15" y="15" width="190" height="120" fill="none" stroke="#A39681" stroke-width="2" stroke-dasharray="6,4" rx="4" />
      <path d="M 90 75 L 130 75 M 115 60 L 130 75 L 115 90" fill="none" stroke="#8FA3B5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 130 75 C 100 45 80 60 80 75" fill="none" stroke="#8FA3B5" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Box 4: Trash / Recycle -->
    <g transform="translate(1060, 620)">
      <rect width="220" height="150" fill="url(#box-grad)" rx="8" />
      <rect x="15" y="15" width="190" height="120" fill="none" stroke="#A39681" stroke-width="2" stroke-dasharray="6,4" rx="4" />
      <path d="M 95 60 L 125 90 M 125 60 L 95 90" fill="none" stroke="#A88282" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>

</svg>
