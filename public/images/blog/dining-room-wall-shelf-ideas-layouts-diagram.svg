<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
<title id="t">Six dining room wall shelf layouts</title>
<desc id="d">Six small wall elevations: a single shelf above a sideboard, two stacked shelves, a symmetrical pair around a window, a full display wall, corner shelves and picture ledges.</desc>
