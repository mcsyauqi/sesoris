<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="What to store on each side of an island"><title>What to store on each side of an island</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">What to store on each side of an island</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="40" y="100" width="1120" height="50" fill="#1B5E3B"/><text x="60" y="132" font-size="16" font-weight="700" text-anchor="start" fill="#fff">Island side</text><text x="360" y="132" font-size="16" font-weight="700" text-anchor="start" fill="#fff">Store here</text><text x="800" y="132" font-size="16" font-weight="700" text-anchor="start" fill="#fff">Organizer that helps</text><rect x="40" y="150" width="1120" height="70" fill="#fff" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="192" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Facing the sink</text><text x="360" y="192" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Knives, tools, cutting boards, wraps</text><text x="800" y="192" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Drawer dividers, board rack</text><rect x="40" y="220" width="1120" height="70" fill="#e3efe7" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="262" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Facing the cooktop</text><text x="360" y="262" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Pots, pans, lids, oils, spices</text><text x="800" y="262" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Deep drawers, lid divider</text><rect x="40" y="290" width="1120" height="70" fill="#fff" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="332" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Facing the fridge</text><text x="360" y="332" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Food containers, snacks, lunch gear</text><text x="800" y="332" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Pull-out baskets, clear bins</text><rect x="40" y="360" width="1120" height="70" fill="#e3efe7" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="402" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Seating side</text><text x="360" y="402" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Nothing that blocks knees</text><text x="800" y="402" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Shallow panels only</text><rect x="40" y="430" width="1120" height="70" fill="#fff" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="472" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">End cap</text><text x="360" y="472" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Cookbooks, serving bowls, bottles</text><text x="800" y="472" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Open shelves, wine cubby</text><rect x="40" y="500" width="1120" height="70" fill="#e3efe7" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="542" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Countertop</text><text x="360" y="542" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Daily oil, salt, a fruit bowl</text><text x="800" y="542" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">One tray, bread box</text><text x="600" y="620" font-size="17" font-weight="700" text-anchor="middle" fill="#1B5E3B">Rule: store items at the side of the island where you use them.</text></svg>