<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Mounting cat shelves"><title>Mounting cat shelves</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Mounting cat shelves</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="40" y="100" width="350" height="535" rx="12" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="215" y="138" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2a24">Screw into a stud</text><rect x="100" y="165" width="40" height="230" fill="#c9d3cc"/><text x="120" y="412" font-size="13" text-anchor="middle" fill="#5b6b62">wall</text><rect x="104" y="165" width="32" height="230" fill="#d9b98a"/><rect x="140" y="250" width="190" height="16" fill="#1B5E3B"/><rect x="140" y="266" width="12" height="60" fill="#1f2a24"/><line x1="110" y1="290" x2="152" y2="290" stroke="#E07A2E" stroke-width="4"/><text x="240" y="240" font-size="14" text-anchor="middle" fill="#1f2a24">shelf</text><text x="120" y="186" font-size="13" text-anchor="middle" fill="#1f2a24">stud</text><rect x="115" y="430" width="200" height="34" rx="6" fill="#1B5E3B"/><text x="215" y="453" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Strongest hold</text><text x="64" y="500" font-size="15" fill="#5b6b62">Use a stud finder, then drive</text><text x="64" y="524" font-size="15" fill="#5b6b62">screws through the bracket into</text><text x="64" y="548" font-size="15" fill="#5b6b62">the wooden stud behind drywall.</text><rect x="425" y="100" width="350" height="535" rx="12" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="600" y="138" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2a24">Heavy-duty anchor</text><rect x="485" y="165" width="40" height="230" fill="#c9d3cc"/><text x="505" y="412" font-size="13" text-anchor="middle" fill="#5b6b62">wall</text><rect x="525" y="250" width="190" height="16" fill="#1B5E3B"/><rect x="525" y="266" width="12" height="60" fill="#1f2a24"/><path d="M485 284 l40 6 l-40 6 z" fill="#E07A2E"/><text x="625" y="240" font-size="14" text-anchor="middle" fill="#1f2a24">shelf</text><rect x="500" y="430" width="200" height="34" rx="6" fill="#8a6d1f"/><text x="600" y="453" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">OK if rated for the load</text><text x="449" y="500" font-size="15" fill="#5b6b62">Where there is no stud, use</text><text x="449" y="524" font-size="15" fill="#5b6b62">anchors rated for shelves and</text><text x="449" y="548" font-size="15" fill="#5b6b62">follow the maker's weight rating.</text><rect x="810" y="100" width="350" height="535" rx="12" fill="#fff" stroke="#b23b3b" stroke-width="2"/><text x="985" y="138" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2a24">Adhesive strips</text><rect x="870" y="165" width="40" height="230" fill="#c9d3cc"/><text x="890" y="412" font-size="13" text-anchor="middle" fill="#5b6b62">wall</text><rect x="910" y="250" width="190" height="16" fill="#c9d3cc"/><rect x="910" y="266" width="8" height="40" fill="#ddd"/><line x1="950" y1="200" x2="1060" y2="330" stroke="#b23b3b" stroke-width="6"/><line x1="1060" y1="200" x2="950" y2="330" stroke="#b23b3b" stroke-width="6"/><rect x="885" y="430" width="200" height="34" rx="6" fill="#b23b3b"/><text x="985" y="453" font-size="16" font-weight="700" text-anchor="middle" fill="#fff">Not suitable</text><text x="834" y="500" font-size="15" fill="#5b6b62">Not designed for a jumping</text><text x="834" y="524" font-size="15" fill="#5b6b62">animal. Never use strips or</text><text x="834" y="548" font-size="15" fill="#5b6b62">picture hooks for cat shelves.</text></svg>
