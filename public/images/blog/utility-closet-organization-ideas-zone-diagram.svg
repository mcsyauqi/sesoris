<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Utility closet zones"><title>Utility closet zones</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Utility closet zones</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="40" y="95" width="560" height="540" rx="6" fill="#fff" stroke="#1f2a24" stroke-width="3"/><rect x="60" y="300" width="190" height="315" rx="8" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2" stroke-dasharray="8 6"/><rect x="100" y="360" width="110" height="235" rx="50" fill="#fff" stroke="#1f2a24" stroke-width="2"/><text x="155" y="485" font-size="15" text-anchor="middle" fill="#1f2a24">Water</text><text x="155" y="505" font-size="15" text-anchor="middle" fill="#1f2a24">heater</text><text x="155" y="325" font-size="15" font-weight="700" text-anchor="middle" fill="#1B5E3B">KEEP CLEAR</text><line x1="290" y1="160" x2="290" y2="560" stroke="#5b6b62" stroke-width="5" stroke-linecap="round"/><line x1="316" y1="160" x2="316" y2="540" stroke="#5b6b62" stroke-width="5" stroke-linecap="round"/><line x1="342" y1="160" x2="342" y2="520" stroke="#5b6b62" stroke-width="5" stroke-linecap="round"/><line x1="368" y1="160" x2="368" y2="500" stroke="#5b6b62" stroke-width="5" stroke-linecap="round"/><text x="330" y="600" font-size="15" text-anchor="middle" fill="#1f2a24">Brooms and mops</text><text x="330" y="620" font-size="15" text-anchor="middle" fill="#1f2a24">on wall clips</text><rect x="420" y="165" width="165" height="10" fill="#1B5E3B"/><rect x="428" y="127" width="44" height="38" rx="4" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><rect x="480" y="127" width="44" height="38" rx="4" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><rect x="532" y="127" width="44" height="38" rx="4" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><rect x="420" y="245" width="165" height="10" fill="#1B5E3B"/><rect x="428" y="207" width="44" height="38" rx="4" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><rect x="480" y="207" width="44" height="38" rx="4" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><rect x="532" y="207" width="44" height="38" rx="4" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><rect x="420" y="320" width="165" height="10" fill="#1B5E3B"/><rect x="428" y="282" width="44" height="38" rx="4" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><rect x="480" y="282" width="44" height="38" rx="4" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><rect x="532" y="282" width="44" height="38" rx="4" fill="#fff" stroke="#c9d3cc" stroke-width="2"/><text x="502" y="355" font-size="14" text-anchor="middle" fill="#5b6b62">Wire shelf unit</text><rect x="640" y="95" width="520" height="100" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="654" y="123" font-size="18" font-weight="700" fill="#1f2a24">1. Service zone</text><text x="654" y="147" font-size="15" fill="#5b6b62">Clear space around the water heater, furnace, valves</text><text x="654" y="168" font-size="15" fill="#5b6b62">and panel. Follow the clearance in the manual.</text><rect x="640" y="210" width="520" height="100" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="654" y="238" font-size="18" font-weight="700" fill="#1f2a24">2. Tall-tool zone</text><text x="654" y="262" font-size="15" fill="#5b6b62">Brooms, mops and vacuum hang on a side wall,</text><text x="654" y="283" font-size="15" fill="#5b6b62">off the floor so mop heads dry.</text><rect x="640" y="325" width="520" height="100" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="654" y="353" font-size="18" font-weight="700" fill="#1f2a24">3. Daily zone, waist to eye height</text><text x="654" y="377" font-size="15" fill="#5b6b62">Weekly sprays and cloths, grouped by task</text><text x="654" y="398" font-size="15" fill="#5b6b62">in labeled bins.</text><rect x="640" y="440" width="520" height="80" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="654" y="468" font-size="18" font-weight="700" fill="#1f2a24">4. Reserve zone, top shelf</text><text x="654" y="492" font-size="15" fill="#5b6b62">Refills, spare bulbs, HVAC filters.</text><rect x="640" y="535" width="520" height="100" rx="10" fill="#fff" stroke="#E07A2E" stroke-width="2"/><text x="654" y="563" font-size="18" font-weight="700" fill="#1f2a24">5. Door zone</text><text x="654" y="587" font-size="15" fill="#5b6b62">Over-the-door rack for light items. No gasoline</text><text x="654" y="608" font-size="15" fill="#5b6b62">or solvents anywhere near a gas appliance.</text></svg>
