<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Budget garage plan: what to do first</title>
  <desc id="d">Seven-step flow: declutter, zone, reuse what you own, add hooks and pegboard, build or buy shelving, add clear lidded bins, then label and review.</desc>
  <rect width="1200" height="675" fill="#F3F5F0"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1B5E3B"/>
    </marker>
  </defs>
  <text x="60" y="62" font-family="Archivo, Arial, sans-serif" font-size="30" font-weight="700" fill="#16352A">Budget garage plan: spend last, not first</text>
  <text x="60" y="92" font-family="Archivo, Arial, sans-serif" font-size="17" fill="#4A5A52">Free steps remove most of the need for storage. Money goes only where gaps remain.</text>
  <g font-family="Archivo, Arial, sans-serif">
    <!-- row 1 -->
    <rect x="60" y="140" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#1B5E3B" stroke-width="2"/>
    <rect x="76" y="156" width="64" height="26" rx="13" fill="#DDEBE2"/><text x="108" y="174" font-size="14" font-weight="700" fill="#1B5E3B" text-anchor="middle">FREE</text>
    <text x="76" y="220" font-size="22" font-weight="700" fill="#16352A">1. Declutter</text>
    <text x="76" y="248" font-size="15" fill="#4A5A52">One section at a time.</text>
    <text x="76" y="268" font-size="15" fill="#4A5A52">Donate, recycle, dispose.</text>
    <rect x="340" y="140" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#1B5E3B" stroke-width="2"/>
    <rect x="356" y="156" width="64" height="26" rx="13" fill="#DDEBE2"/><text x="388" y="174" font-size="14" font-weight="700" fill="#1B5E3B" text-anchor="middle">FREE</text>
    <text x="356" y="220" font-size="22" font-weight="700" fill="#16352A">2. Zone</text>
    <text x="356" y="248" font-size="15" fill="#4A5A52">Give every category</text>
    <text x="356" y="268" font-size="15" fill="#4A5A52">its own address.</text>
    <rect x="620" y="140" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#1B5E3B" stroke-width="2"/>
    <rect x="636" y="156" width="64" height="26" rx="13" fill="#DDEBE2"/><text x="668" y="174" font-size="14" font-weight="700" fill="#1B5E3B" text-anchor="middle">FREE</text>
    <text x="636" y="220" font-size="22" font-weight="700" fill="#16352A">3. Reuse</text>
    <text x="636" y="248" font-size="15" fill="#4A5A52">Boxes, jars, buckets</text>
    <text x="636" y="268" font-size="15" fill="#4A5A52">and shelves you own.</text>
    <rect x="900" y="140" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#E8743B" stroke-width="2"/>
    <rect x="916" y="156" width="96" height="26" rx="13" fill="#F6E1D3"/><text x="964" y="174" font-size="14" font-weight="700" fill="#B4501F" text-anchor="middle">LOW COST</text>
    <text x="916" y="220" font-size="19" font-weight="700" fill="#16352A">4. Hooks and pegboard</text>
    <text x="916" y="248" font-size="15" fill="#4A5A52">Into studs. Clears the</text>
    <text x="916" y="268" font-size="15" fill="#4A5A52">floor fast.</text>
    <!-- row 2 -->
    <rect x="200" y="400" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#E8743B" stroke-width="2"/>
    <rect x="216" y="416" width="124" height="26" rx="13" fill="#F6E1D3"/><text x="278" y="434" font-size="14" font-weight="700" fill="#B4501F" text-anchor="middle">BUILD OR BUY</text>
    <text x="216" y="480" font-size="22" font-weight="700" fill="#16352A">5. Shelving</text>
    <text x="216" y="508" font-size="15" fill="#4A5A52">Sized to your bins.</text>
    <text x="216" y="528" font-size="15" fill="#4A5A52">Anchor tall units.</text>
    <rect x="480" y="400" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#E8743B" stroke-width="2"/>
    <rect x="496" y="416" width="110" height="26" rx="13" fill="#F6E1D3"/><text x="551" y="434" font-size="14" font-weight="700" fill="#B4501F" text-anchor="middle">SELECTIVE</text>
    <text x="496" y="480" font-size="22" font-weight="700" fill="#16352A">6. Lidded bins</text>
    <text x="496" y="508" font-size="15" fill="#4A5A52">Only for dust and</text>
    <text x="496" y="528" font-size="15" fill="#4A5A52">pest-prone items.</text>
    <rect x="760" y="400" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#1B5E3B" stroke-width="2"/>
    <rect x="776" y="416" width="64" height="26" rx="13" fill="#DDEBE2"/><text x="808" y="434" font-size="14" font-weight="700" fill="#1B5E3B" text-anchor="middle">FREE</text>
    <text x="776" y="480" font-size="22" font-weight="700" fill="#16352A">7. Label + review</text>
    <text x="776" y="508" font-size="15" fill="#4A5A52">Tape and marker work.</text>
    <text x="776" y="528" font-size="15" fill="#4A5A52">Check after a month.</text>
  </g>
  <g stroke="#1B5E3B" stroke-width="3" fill="none" marker-end="url(#ar)">
    <line x1="302" y1="215" x2="336" y2="215"/>
    <line x1="582" y1="215" x2="616" y2="215"/>
    <line x1="862" y1="215" x2="896" y2="215"/>
    <path d="M1020 292 L1020 345 L320 345 L320 396"/>
    <line x1="442" y1="475" x2="476" y2="475"/>
    <line x1="722" y1="475" x2="756" y2="475"/>
  </g>
  <text x="60" y="625" font-family="Archivo, Arial, sans-serif" font-size="14" fill="#6B7A72">Sesoris planning sketch. Cost labels are relative, not prices.</text>
</svg>
