<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Planning a cat wall shelf route"><title>Planning a cat wall shelf route</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Planning a cat wall shelf route</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="40" y="95" width="760" height="540" rx="6" fill="#fff" stroke="#1f2a24" stroke-width="3"/><rect x="600" y="130" width="170" height="220" fill="#e3efe7" stroke="#1B5E3B" stroke-width="3"/><line x1="685" y1="130" x2="685" y2="350" stroke="#1B5E3B" stroke-width="2"/><text x="685" y="375" font-size="15" text-anchor="middle" fill="#1f2a24">Window (screened)</text><rect x="60" y="520" width="250" height="90" rx="14" fill="#c9d3cc"/><text x="185" y="572" font-size="16" text-anchor="middle" fill="#1f2a24">Sofa arm (on-ramp)</text><rect x="300" y="470" width="90" height="14" rx="3" fill="#1B5E3B"/><text x="345" y="462" font-size="14" text-anchor="middle" fill="#5b6b62">Step 1</text><rect x="380" y="400" width="90" height="14" rx="3" fill="#1B5E3B"/><text x="425" y="392" font-size="14" text-anchor="middle" fill="#5b6b62">Step 2</text><rect x="300" y="330" width="90" height="14" rx="3" fill="#1B5E3B"/><text x="345" y="322" font-size="14" text-anchor="middle" fill="#5b6b62">Step 3</text><rect x="380" y="260" width="90" height="14" rx="3" fill="#1B5E3B"/><text x="425" y="252" font-size="14" text-anchor="middle" fill="#5b6b62">Step 4</text><rect x="470" y="200" width="90" height="14" rx="3" fill="#1B5E3B"/><text x="515" y="192" font-size="14" text-anchor="middle" fill="#5b6b62">Step 5</text><rect x="560" y="200" width="40" height="8" fill="#E07A2E"/><text x="575" y="190" font-size="13" text-anchor="middle" fill="#E07A2E">bridge</text><rect x="600" y="190" width="120" height="18" rx="4" fill="#1B5E3B"/><text x="660" y="182" font-size="14" text-anchor="middle" fill="#1f2a24">Window perch</text><path d="M120 300 Q170 340 220 300" fill="none" stroke="#5b6b62" stroke-width="4"/><text x="170" y="285" font-size="14" text-anchor="middle" fill="#5b6b62">Hammock (2nd way down)</text><path d="M260 520 L320 480 L420 410 L340 340 L420 270 L510 210" fill="none" stroke="#E07A2E" stroke-width="3" stroke-dasharray="6 6"/><rect x="830" y="95" width="330" height="125" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="844" y="123" font-size="18" font-weight="700" fill="#1f2a24">Start easy</text><text x="844" y="147" font-size="15" fill="#5b6b62">Begin from furniture the cat</text><text x="844" y="168" font-size="15" fill="#5b6b62">already jumps onto, like a</text><text x="844" y="189" font-size="15" fill="#5b6b62">sofa arm or cat tree.</text><rect x="830" y="235" width="330" height="125" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="844" y="263" font-size="18" font-weight="700" fill="#1f2a24">Comfortable steps</text><text x="844" y="287" font-size="15" fill="#5b6b62">Space steps by the jumps your</text><text x="844" y="308" font-size="15" fill="#5b6b62">least agile cat already makes.</text><text x="844" y="329" font-size="15" fill="#5b6b62">Shorter steps for seniors.</text><rect x="830" y="375" width="330" height="115" rx="10" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="844" y="403" font-size="18" font-weight="700" fill="#1f2a24">Worth the climb</text><text x="844" y="427" font-size="15" fill="#5b6b62">End at a perch by a window</text><text x="844" y="448" font-size="15" fill="#5b6b62">or a cozy spot up high.</text><rect x="830" y="505" width="330" height="130" rx="10" fill="#fff" stroke="#E07A2E" stroke-width="2"/><text x="844" y="533" font-size="18" font-weight="700" fill="#1f2a24">Two ways down</text><text x="844" y="557" font-size="15" fill="#5b6b62">Add a second route so no cat</text><text x="844" y="578" font-size="15" fill="#5b6b62">is trapped at the top. Keep</text><text x="844" y="599" font-size="15" fill="#5b6b62">landing zones clear.</text></svg>
