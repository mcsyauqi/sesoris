<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Office supply closet: what goes on each shelf"><title>Office supply closet: what goes on each shelf</title><rect width="1200" height="675" fill="#f6f7f4"/><text x="40" y="52" font-size="28" font-weight="700" fill="#1B5E3B">Office supply closet: what goes on each shelf</text><rect x="40" y="66" width="140" height="5" fill="#E07A2E"/><rect x="40" y="100" width="1120" height="50" fill="#1B5E3B"/><text x="60" y="132" font-size="16" font-weight="700" text-anchor="start" fill="#fff">Shelf height</text><text x="360" y="132" font-size="16" font-weight="700" text-anchor="start" fill="#fff">Store here</text><text x="800" y="132" font-size="16" font-weight="700" text-anchor="start" fill="#fff">Container that helps</text><rect x="40" y="150" width="1120" height="70" fill="#fff" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="192" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Top shelf</text><text x="360" y="192" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Backstock paper, archive files, seasonal</text><text x="800" y="192" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Lidded bins with a front label</text><rect x="40" y="220" width="1120" height="70" fill="#e3efe7" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="262" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Upper middle</text><text x="360" y="262" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Envelopes, notebooks, sticky notes</text><text x="800" y="262" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Open bins, magazine files</text><rect x="40" y="290" width="1120" height="70" fill="#fff" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="332" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Eye level</text><text x="360" y="332" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Pens, tape, staples, chargers you use daily</text><text x="800" y="332" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Mesh trays, small clear boxes</text><rect x="40" y="360" width="1120" height="70" fill="#e3efe7" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="402" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Waist level</text><text x="360" y="402" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Printer, ink, label maker, shredder bags</text><text x="800" y="402" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Wire shelf or pull-out tray</text><rect x="40" y="430" width="1120" height="70" fill="#fff" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="472" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Floor</text><text x="360" y="472" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Heavy boxes, shredder, recycling</text><text x="800" y="472" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Rolling cart, floor bin</text><rect x="40" y="500" width="1120" height="70" fill="#e3efe7" stroke="#1B5E3B" stroke-width="1.5"/><text x="60" y="542" font-size="16" font-weight="700" text-anchor="start" fill="#1f2a24">Door back</text><text x="360" y="542" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Flat items, mail to file, cables</text><text x="800" y="542" font-size="15" font-weight="400" text-anchor="start" fill="#1f2a24">Over-door pockets, hooks</text><text x="600" y="620" font-size="17" font-weight="700" text-anchor="middle" fill="#1B5E3B">Rule: the more often you reach for it, the closer to eye level it lives.</text></svg>