oke="#7f8d86"/><text x="628" y="430" font-size="17" font-weight="700" fill="#1B5E3B" text-anchor="start">Good</text><text x="628" y="458" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">Any blade length fits</text><text x="628" y="510" font-size="17" font-weight="700" fill="#E07A2E" text-anchor="start">Watch for</text><text x="628" y="538" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">Needs a dry, safe wall</text><rect x="889" y="100" width="268" height="480" rx="8" fill="#fff" stroke="#1B5E3B" stroke-width="2"/><text x="1023" y="142" font-size="21" font-weight="700" fill="#1B5E3B" text-anchor="middle">Blade guards</text><rect x="927" y="240" width="62" height="16" rx="4" fill="#3b4a42"/><path d="M989,240 L1085,242.4 Q1046.6,262 989,261 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/><rect x="987" y="230" width="134" height="44" rx="10" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><rect x="927" y="320" width="62" height="14" rx="4" fill="#3b4a42"/><path d="M989,320 L1055,322.1 Q1028.6,340 989,339 z" fill="#c9d2cd" stroke="#7f8d86" stroke-width="1"/><rect x="987" y="310" width="104" height="40" rx="10" fill="#e3efe7" stroke="#1B5E3B" stroke-width="2"/><text x="911" y="430" font-size="17" font-weight="700" fill="#1B5E3B" text-anchor="start">Good</text><text x="911" y="458" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">Cheap, works in any drawer</text><text x="911" y="510" font-size="17" font-weight="700" fill="#E07A2E" text-anchor="start">Watch for</text><text x="911" y="538" font-size="16" font-weight="400" fill="#1f2a24" text-anchor="start">Must go on a dry blade</text></svg>