      <linearGradient id="greenGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#8DC63F"/>
        <stop offset="100%" style="stop-color:#FFC107"/>
      </linearGradient>
    </defs>
    <path d="M18 26 L62 26 L56 76 L12 76 Z" fill="url(#greenGradIcon)"/>

